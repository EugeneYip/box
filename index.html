<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b111b" />
    <meta name="description" content="Worldseed — shape a living world. Sculpt continents, paint biomes, seed life and watch kingdoms rise." />
    <title>Worldseed — Shape a Living World</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff1c8'/%3E%3Cstop offset='.5' stop-color='%23ecc673'/%3E%3Cstop offset='1' stop-color='%23a6772f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='24' cy='24' r='22' fill='%23111621'/%3E%3Ccircle cx='24' cy='24' r='20' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Cpath d='M24 38c-5.6 0-9-4-9-9.2 0-5.8 4.4-9.6 9-13.8 4.6 4.2 9 8 9 13.8 0 5.2-3.4 9.2-9 9.2z' fill='url(%23g)'/%3E%3Cpath d='M24 15V9M24 12c-1.2-3.2-4.2-5-7.6-4.6.6 3.4 3.6 5.2 7.6 4.6zM24 10.8c1.2-3 4-4.6 7.2-4.2-.6 3.2-3.4 4.8-7.2 4.2z' fill='url(%23g)' stroke='url(%23g)' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b111b;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 45%, #18202f 0%, #0b111b 60%, #06090f 100%);
        transition: opacity 0.6s ease;
      }
      #boot.out {
        opacity: 0;
        pointer-events: none;
      }
      #boot svg {
        width: 72px;
        height: 72px;
        animation: boot-pulse 2.2s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(240, 200, 120, 0.4));
      }
      #boot p {
        margin: 18px 0 0;
        text-align: center;
        font: 600 11px/1 system-ui, sans-serif;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: rgba(235, 201, 119, 0.7);
        padding-left: 0.4em;
      }
      #boot .boot-sub {
        margin-top: 12px;
        letter-spacing: 0.12em;
        text-transform: none;
        font-size: 12px;
        color: rgba(235, 225, 200, 0.62);
        min-height: 1em;
      }
      /* paced bar: a compositor transition, so it keeps moving while the world builds */
      #boot .boot-bar {
        display: block;
        width: 180px;
        height: 2px;
        margin: 14px auto 0;
        border-radius: 1px;
        overflow: hidden;
        background: rgba(235, 201, 119, 0.14);
      }
      #boot .boot-bar b {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #a6772f, #ecc673, #fff1c8);
        transform-origin: 0 50%;
        transform: scaleX(0.02);
      }
      @keyframes boot-fill {
        from {
          transform: scaleX(0.02);
        }
        to {
          transform: scaleX(0.92);
        }
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
          transform: scale(0.96);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui-root"></div>
    </div>
    <div id="boot" aria-hidden="true">
      <div>
        <svg viewBox="0 0 48 48">
          <defs>
            <linearGradient id="bootg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c8" /><stop offset=".5" stop-color="#ecc673" /><stop offset="1" stop-color="#a6772f" /></linearGradient>
          </defs>
          <circle cx="24" cy="24" r="20.6" fill="none" stroke="url(#bootg)" stroke-width="1.3" />
          <path d="M24 37.5c-5.6 0-9-4-9-9.2 0-5.8 4.4-9.6 9-13.8 4.6 4.2 9 8 9 13.8 0 5.2-3.4 9.2-9 9.2z" fill="url(#bootg)" />
          <path d="M24 14.6V8.8" stroke="url(#bootg)" stroke-width="1.6" stroke-linecap="round" />
          <path d="M24 11.6c-1.2-3.2-4.2-5-7.6-4.6.6 3.4 3.6 5.2 7.6 4.6zM24 10.4c1.2-3 4-4.6 7.2-4.2-.6 3.2-3.4 4.8-7.2 4.2z" fill="url(#bootg)" />
        </svg>
        <p>Worldseed</p>
        <p class="boot-sub" id="boot-sub"></p>
        <i class="boot-bar"><b id="boot-bar"></b></i>
      </div>
    </div>
    <script>
      // Fade the boot splash once the first frames are on screen (instantly for ?ui=0 captures).
      (function () {
        var boot = document.getElementById('boot');
        var quick = /[?&]ui=0(&|$)/.test(location.search);
        var t0 = Date.now();
        // Name what is being built (a reload from New World or the title leaves a
        // note) and pace the bar by how long this preset and size took last time.
        var q = new URLSearchParams(location.search);
        var key = 'worldseed.bootms.' + (q.get('preset') || 'continent') + ':' + (q.get('size') || 'auto');
        var est = 0,
          note = null;
        try {
          note = JSON.parse(sessionStorage.getItem('worldseed.boot') || 'null');
          sessionStorage.removeItem('worldseed.boot');
          est = +localStorage.getItem(key) || 0;
        } catch (e) {}
        if (!est) {
          var sz = +q.get('size') || 256;
          var wide = q.get('preset') === 'earth';
          est = 2500 + ((sz * (wide ? sz / 2 : sz)) / 65536) * 2600;
        }
        var sub = document.getElementById('boot-sub');
        var bar = document.getElementById('boot-bar');
        if (note && note.label && Date.now() - note.t < 120000) sub.textContent = note.label;
        bar.style.animation = 'boot-fill ' + Math.round(est) + 'ms cubic-bezier(.25,.7,.35,1) forwards';
        (function poll() {
          if (window.__ready || window.__error || Date.now() - t0 > 30000) {
            try {
              if (window.__ready && !window.__error) localStorage.setItem(key, String(Math.round(performance.now())));
            } catch (e) {}
            bar.style.animation = 'none';
            bar.style.transform = 'scaleX(1)';
            if (quick) boot.remove();
            else {
              boot.className = 'out';
              setTimeout(function () {
                boot.remove();
              }, 700);
            }
          } else setTimeout(poll, 60);
        })();
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
